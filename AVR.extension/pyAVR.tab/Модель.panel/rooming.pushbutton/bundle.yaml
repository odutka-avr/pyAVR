title: "Квартирографія"

tooltip: >-
  Розрахунок квартирографії


  Мають бути заповнення параметри в приміщеннях:
  
  "AVR_Номер квартири"

  "AVR_Тип приміщення"
  
  "Departament" має мати значення "Житло"


  Типи приміщень:

  1 - Житлове - Коеф. 1

  2 - Нежитлове - Коеф. 1

  3 - Лоджія - Коеф. 0,5

  4 - Балкон - Коеф. 0,3

  5 - Заскленні Лоджія/Балкон - Коеф. 1


