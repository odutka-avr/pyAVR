title: "Експорт\nТЕПів"

tooltip: >-
  Експорт ТЕПів в Excel


  Для формування ТЕП в приміщеннях

  повинні бути заповненні параметри:


  "AVR_Площа Квартири Загальна"

  "AVR_Площа Квартири Житлова"

  "AVR_Площа Квартири"

  "AVR_Номер Квартири"

  "AVR_Кількість кімнат"

  "Departament" - такі категорії : "Житло", "Комерція", "Паркінг"


  В формах "Comments" запвонено "+0" або "-0"


  Створенні зони на видах  "Загальна площа будинку"

  Розміщенні паркомісця

